services:
  nginx:
    image: nginx:1.28.3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../web/dist:/app/web/dist:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/nginx/certs:ro
    depends_on:
      - newapieduserver
    networks:
      - newapi-network

  newapieduserver:
    image: newapiedu:v0.1.0
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - JWT_SECRET=random_string
    networks:
      - newapi-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ssl_certs:

networks:
  newapi-network:
    driver: bridge
