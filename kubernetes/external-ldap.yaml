apiVersion: v1
kind: Service
metadata:
  name: ldap
  namespace: newapi
  labels:
    app.kubernetes.io/name: newapi-edu
    app.kubernetes.io/component: ldap
spec:
  type: ClusterIP
  ports:
    - name: ldap
      port: 389
      targetPort: 389
      protocol: TCP
    - name: ldaps
      port: 636
      targetPort: 636
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ldap
  namespace: newapi
  labels:
    app.kubernetes.io/name: newapi-edu
    app.kubernetes.io/component: ldap
subsets:
  - addresses:
      - ip: 172.16.74.1
    ports:
      - name: ldap
        port: 389
        protocol: TCP
      - name: ldaps
        port: 636
        protocol: TCP
