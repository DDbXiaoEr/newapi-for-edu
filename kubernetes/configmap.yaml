apiVersion: v1
kind: ConfigMap
metadata:
  name: newapi-edu-config
  namespace: newapi
  labels:
    app.kubernetes.io/name: newapi-edu
    app.kubernetes.io/component: backend
data:
  TZ: Asia/Shanghai
  PORT: "3000"
  ERROR_LOG_ENABLED: "true"
  BATCH_UPDATE_ENABLED: "true"
  NODE_NAME: new-api-node-1
  JWT_EXPIRATION_SECONDS: "604800"
  REQUIRED_ENV_VARS: SQL_DSN,LOG_SQL_DSN
  SYNC_FREQUENCY: "60"
  GIN_MODE: release
