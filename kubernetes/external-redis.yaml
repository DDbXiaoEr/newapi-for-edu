apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: newapi
  labels:
    app.kubernetes.io/name: newapi-edu
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis
  namespace: newapi
  labels:
    app.kubernetes.io/name: newapi-edu
    app.kubernetes.io/component: redis
subsets:
  - addresses:
      - ip: 172.16.74.1
    ports:
      - name: redis
        port: 6379
        protocol: TCP
